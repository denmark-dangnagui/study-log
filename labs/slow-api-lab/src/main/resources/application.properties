spring.application.name=slow-api-lab

# 인메모리 H2 (별도 DB 설치 불필요)
spring.datasource.url=jdbc:h2:mem:lab;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# 쿼리 개수를 세기 위한 Hibernate 통계 (GET /api/stats 에서 확인)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# 실습 중 SQL을 눈으로 보고 싶을 때만 true로 바꾸세요 (부하 테스트 중에는 반드시 false)
spring.jpa.show-sql=false

server.tomcat.threads.max=50
